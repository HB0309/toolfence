[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolfence"
version = "0.1.0"
description = "Tool-surface auditing and injection-resilience evaluation for MCP agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pydantic>=2",
    "jsonschema>=4",
]
dev-playwright = [
    "toolfence[dev]",
    "playwright>=1.40",
]

[project.scripts]
toolfence = "toolfence.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolfence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
