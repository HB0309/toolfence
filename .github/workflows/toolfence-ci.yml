name: ToolFence CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite (no network)
        run: pytest tests/ --skip-network

      - name: Surface-diff CI check
        run: toolfence ci-check --surface results/surface.json
        continue-on-error: true   # post comment even on failure (B-5 surface.json may not exist yet)
