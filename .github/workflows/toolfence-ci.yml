name: ToolFence CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite (no network)
        run: pytest tests/ --skip-network

      - name: Surface-diff CI check
        id: surface_check
        run: |
          toolfence ci-check --surface results/surface.json > /tmp/ci_check_output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat /tmp/ci_check_output.txt
        continue-on-error: true

      - name: Post surface-diff failure comment
        if: github.event_name == 'pull_request' && steps.surface_check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/ci_check_output.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## WARNING: ToolFence Surface-Diff Check Failed\n\`\`\`\n${output}\n\`\`\``
            });